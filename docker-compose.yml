services:
  backend:
    build:
      context: ./backend
    container_name: rssb-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-8h}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Super Admin}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
    volumes:
      - backend_prisma:/app/prisma
      - backend_uploads:/app/uploads
    ports:
      - "4000:4000"

  security-portal:
    build:
      context: ./security-portal
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL}
    container_name: rssb-security-portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin-dashboard:
    build:
      context: ./admin-dashboard
    container_name: rssb-admin-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  backend_prisma:
  backend_uploads:
